name: windows-converter
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller "pymupdf==1.24.14" "opencv-python-headless==4.10.0.84" "numpy<2.1" pdf2docx python-docx openpyxl xlrd reportlab Pillow pillow-heif
      - run: >
          pyinstaller --onefile --windowed --name Konverter
          --paths converter --add-data "converter/fonts;fonts"
          --hidden-import converters
          --exclude-module matplotlib --exclude-module pandas --exclude-module scipy --exclude-module IPython
          --exclude-module pytest --exclude-module setuptools --exclude-module pip --exclude-module onnxruntime
          --exclude-module networkx --exclude-module numpy.f2py --exclude-module tkinter.test --exclude-module sqlite3 --exclude-module lib2to3
          winapp/app.py
      - name: smoke test
        shell: bash
        run: |
          echo "Привет" > t.txt
          ./dist/Konverter.exe --cli t.txt pdf out
          ./dist/Konverter.exe --cli out/t.pdf docx out
          ./dist/Konverter.exe --cli out/t.pdf png out
          ls -l out
          test -s out/t.pdf && test -s out/t.docx && test -s out/t.png
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-converter
          name: Конвертер для Windows
          files: dist/Konverter.exe
